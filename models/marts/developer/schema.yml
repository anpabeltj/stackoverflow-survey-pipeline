version: 2

models:
  - name: developer_profile
    description: One row per survey respondent with salary and experience levels.
    columns:
      - name: response_id
        description: Survey response identifier, carried over from stg_survey
        data_tests:
          - unique
          - not_null
      - name: salary_level
        description: "Entry (< 50k), Mid (50k to 100k), Senior (> 100k), Unknown (no salary)"
        data_tests:
          - accepted_values:
              values: ["Entry", "Mid", "Senior", "Unknown"]
      - name: experience_level
        data_tests:
          - accepted_values:
              values: ["Junior", "Mid", "Senior", "Unknown"]
